<div class="report-generator-container">
  <div class="report-generator-card">
    <h2 class="report-generator-card__title">Generate AI Report</h2>
    <p class="report-generator-card__description">
      Generate structured business reports from your documents.
    </p>

    <form class="report-form" (ngSubmit)="generateReport()">
      <div class="form-group">
        <label for="topic" class="form-label">Report Topic *</label>
        <input
          type="text"
          id="topic"
          class="form-input"
          [(ngModel)]="topic"
          name="topic"
          placeholder="e.g., Financial Analysis Q4 2024"
          [disabled]="isGenerating"
          required
          minlength="10"
        />
        <p class="form-hint">Minimum 10 characters</p>
      </div>


        <div class="form-group">
          <label for="aimodelId" class="form-label">AI Models</label>
          <select
            id="aimodelId"
            class="form-select"
            [(ngModel)]="selectedModelId"
            name="aimodelId"
            [disabled]="isGenerating"
          >
            <option *ngFor="let model of models" [value]="model.id">
              {{ model.id }}
            </option>
          </select>
        </div>

      <div class="form-group">
        <label for="document" class="form-label">Document (Optional)</label>
        <select
          id="document"
          class="form-select"
          [(ngModel)]="selectedDocumentId"
          name="document"
          [disabled]="isGenerating"
        >
          <option [value]="undefined">All Documents</option>
          <option *ngFor="let doc of documents$ | async" [value]="doc.documentId">
            {{ doc.documentName }}
          </option>
        </select>
      </div>

      <div class="form-group">
        <label for="topK" class="form-label">Top K Results</label>
        <input
          type="number"
          id="topK"
          class="form-input"
          [value]="activeTopK"
          readonly
        />
        <p class="form-hint">Set by the Query Mode in the training settings.</p>
      </div>

      <div class="form-group">
        <label for="instructions" class="form-label">Additional Instructions (Optional)</label>
        <textarea
          id="instructions"
          class="form-textarea"
          [(ngModel)]="additionalInstructions"
          name="instructions"
          rows="4"
          placeholder="e.g., Focus on risk factors, include specific metrics..."
          [disabled]="isGenerating"
        ></textarea>
      </div>

      <div class="form-actions">
        <button
          type="submit"
          class="btn btn--primary"
          [disabled]="!topic.trim() || topic.trim().length < 10 || isGenerating"
        >
          Generate Report
        </button>
        <button
          type="button"
          class="btn btn--secondary"
          (click)="reset()"
          [disabled]="isGenerating"
        >
          Reset
        </button>
      </div>
    </form>

    <div *ngIf="isGenerating" class="report-generator-loading">
      <app-loading-spinner size="large" message="Generating report..."></app-loading-spinner>
    </div>

    <app-report-viewer
      *ngIf="generatedReport"
      [report]="generatedReport"
    ></app-report-viewer>
  </div>
</div>
